<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <filter id="glowMicro" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Connecting Circuit Lines -->
  <path d="M 180 225 L 340 225 M 460 225 L 620 225 M 400 170 L 400 120 M 400 280 L 400 330" fill="none" stroke="rgba(0, 255, 255, 0.3)" stroke-width="2" stroke-dasharray="6, 6" />

  <!-- Node 1: API Gateway -->
  <g transform="translate(100, 185)">
    <rect width="130" height="80" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="2" filter="url(#glowMicro)" />
    <text x="65" y="38" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">API GATEWAY</text>
    <text x="65" y="58" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Load Balancer</text>
  </g>

  <!-- Central Node: Microservices Cluster -->
  <g transform="translate(320, 160)">
    <rect width="160" height="130" rx="14" fill="rgba(15, 23, 42, 0.95)" stroke="#00ffff" stroke-width="2" filter="url(#glowMicro)" />
    <text x="80" y="40" fill="#00ffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">NODE.JS CORE</text>
    <text x="80" y="70" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">🐳 Docker Engine</text>
    <text x="80" y="95" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">⚡ RabbitMQ Queue</text>
  </g>

  <!-- Node 3: PostgreSQL Database -->
  <g transform="translate(570, 185)">
    <rect width="130" height="80" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#a855f7" stroke-width="2" filter="url(#glowMicro)" />
    <text x="65" y="38" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">POSTGRESQL</text>
    <text x="65" y="58" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">PgBouncer Pool</text>
  </g>

  <text x="400" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="26" text-anchor="middle">SCALABLE MICROSERVICES ARCHITECTURE</text>
  <text x="400" y="100" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">NODE.JS • DOCKER CONTAINERS • FAULT-TOLERANT APIS</text>
</svg>
