<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowUI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" />

  <!-- Animated Spring Waves -->
  <path d="M 100 280 Q 250 120 400 280 T 700 280" fill="none" stroke="url(#purplePink)" stroke-width="3" filter="url(#glowUI)" />
  <path d="M 100 310 Q 250 180 400 310 T 700 310" fill="none" stroke="rgba(0, 255, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4, 4" />

  <!-- Framer Motion Triangle / Logo Style -->
  <g transform="translate(400, 180)">
    <polygon points="-50,-60 50,-60 -50,40" fill="rgba(168, 85, 247, 0.4)" stroke="#a855f7" stroke-width="2" filter="url(#glowUI)" />
    <polygon points="-50,40 50,-60 50,40" fill="rgba(236, 72, 153, 0.4)" stroke="#ec4899" stroke-width="2" />
  </g>

  <text x="400" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" text-anchor="middle">MASTERING FRAMER MOTION</text>
  <text x="400" y="100" fill="#f472b6" font-family="monospace" font-size="13" text-anchor="middle">SPRING PHYSICS • LAYOUT ANIMATIONS • MICRO-INTERACTIONS</text>
</svg>
